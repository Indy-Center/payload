# Payload CMS, deployed to /home/deploy/apps/payload/ on the Vanderbilt VPS. build-and-deploy.yml rsyncs
# deploy/ there, so the compose project is named after the repo.
# Renaming the repo renames the project and its volumes; the old volumes stay behind.
services:
  app:
    # Built and pushed by build-and-deploy.yml.
    image: ghcr.io/indy-center/payload:latest
    restart: unless-stopped
    init: true # forwards stop signals so the container shuts down promptly
    depends_on:
      db:
        condition: service_healthy
    # .env is written on the VPS by the deploy from the repo's ENV_* secrets and variables; it's never in git.
    # deploy/.env.example lists the names.
    env_file:
      - path: .env
        required: false
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET must be set (repo secret ENV_PAYLOAD_SECRET)}
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (repo secret ENV_POSTGRES_PASSWORD)}@db:5432/payload
    volumes:
      # Uploads, when the R2 buckets aren't configured (the R2_* settings in .env.example); with
      # them, uploads go to R2 and these stay empty. Named volumes: the deploy rsyncs with --delete,
      # so they can't live under deploy/.
      - media:/app/media
      - private-media:/app/private-media
    networks:
      - traefik-shared # reachable by Traefik
      - internal # reaches the database
    labels:
      - traefik.enable=true
      # Router names are global across every app on the box; prefix them with the app's name.
      - traefik.http.routers.payload.rule=Host(`cms.flyindycenter.com`)
      - traefik.http.routers.payload.entrypoints=websecure
      - traefik.http.routers.payload.tls=true
      - traefik.http.services.payload.loadbalancer.server.port=3000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  # On the app's own network only, never traefik-shared, and no ports on the host.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_DB: payload
      # Only read when the volume is first created. Changing it later doesn't change the database's password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (repo secret ENV_POSTGRES_PASSWORD)}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

networks:
  traefik-shared:
    external: true
  internal:

volumes:
  db-data:
  media:
  private-media:
