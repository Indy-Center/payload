name: CI

# No push trigger: on main, CI runs inside build-and-deploy.yml, so it still runs once per commit.
on:
  pull_request:
  workflow_call:
    outputs:
      image:
        description: The image name compose runs, without a tag.
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read

env:
  # Must match the app's image in deploy/docker-compose.yml.
  IMAGE: ghcr.io/indy-center/payload
  # Throwaway values for the runner, which the app and the compose file both refuse to start without.
  # The real ones are the repo's ENV_* secrets.
  PAYLOAD_SECRET: ci-only-not-a-secret
  POSTGRES_PASSWORD: payload

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://payload:payload@127.0.0.1:5432/payload
    services:
      # The database the tests run against.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  # Runs alongside check: the image build and smoke test don't need the checks' node_modules.
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: docker compose -f deploy/docker-compose.yml config -q

      # Fails on a mistyped image or tag before it reaches the VPS. Only db: the app image is built
      # from this repo, so CI builds it instead. Pulling :latest would only test the last published
      # image, and fails before the first deploy.
      - name: Database image exists
        run: docker compose -f deploy/docker-compose.yml pull --quiet db

      - uses: docker/setup-buildx-action@v3

      # Tagged as compose expects, so the next step runs this build rather than pulling one.
      # The layer cache skips npm ci when the lockfile hasn't changed, and lets the deploy reuse
      # this build instead of starting over.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uses the VPS layout: the compose project runs from a directory named after the repo, next to
      # an external traefik-shared network.
      - name: Stack starts and stays up
        run: |
          docker network create traefik-shared
          cd deploy
          docker compose up -d
          sleep 15
          docker compose ps
          # Healthy = nothing restarting and no restarts since start.
          if docker inspect -f '{{.State.Restarting}} {{.RestartCount}}' $(docker compose ps -aq) | grep -qv '^false 0$'; then
            docker compose logs --tail 50
            exit 1
          fi

      # The first request runs the migrations against the empty database, then reads the users table.
      - name: App answers from its database
        run: |
          cd deploy
          docker compose exec -T app node -e "
            fetch('http://127.0.0.1:3000/api/users/init')
              .then(async (res) => {
                const body = await res.text();
                console.log(res.status, body);
                if (!res.ok || !body.includes('initialized')) process.exit(1);
              })
              .catch((err) => { console.error(err); process.exit(1); });
          " || { docker compose logs --tail 100; exit 1; }

      # The CMS has no frontend of its own.
      - name: Root redirects to the admin
        run: |
          cd deploy
          docker compose exec -T app node -e "
            fetch('http://127.0.0.1:3000/', { redirect: 'manual' })
              .then((res) => {
                const location = res.headers.get('location');
                console.log(res.status, location);
                if (res.status !== 307 || location !== '/admin') process.exit(1);
              })
              .catch((err) => { console.error(err); process.exit(1); });
          "
