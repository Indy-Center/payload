name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The server this app runs on, by the prefix of its four organization settings (ALEXANDRIA_HOST and so on;
  # docker-infrastructure's README lists each server's). Moving the app to another server starts here.
  SERVER: ALEXANDRIA

concurrency:
  group: deploy-${{ github.event.repository.name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the image to ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: ci # skipped if any check fails
    runs-on: ubuntu-latest
    env:
      # The app's directory on the VPS: /home/deploy/apps/<repo name>/.
      APP: ${{ github.event.repository.name }}
      IMAGE: ${{ needs.ci.outputs.image }}
      URL: https://cms.flyindycenter.com
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/setup-buildx-action@v3

      # CI just built this commit into the same layer cache, so this mostly reuses its layers.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # The source label links the package to this repository, so it inherits the repo's access.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

      # <SERVER>_HOST and <SERVER>_DEPLOY_USER are organization variables, the key and known_hosts are organization
      # secrets; all four are limited to selected repositories.
      # An org admin adds this repository to each of them before the first deploy. Until then this step fails,
      # naming the settings it can't see.
      - name: Set up SSH
        env:
          HOST: ${{ vars[format('{0}_HOST', env.SERVER)] }}
          DEPLOY_USER: ${{ vars[format('{0}_DEPLOY_USER', env.SERVER)] }}
          DEPLOY_SSH_KEY: ${{ secrets[format('{0}_DEPLOY_SSH_KEY', env.SERVER)] }}
          KNOWN_HOSTS: ${{ secrets[format('{0}_KNOWN_HOSTS', env.SERVER)] }}
        run: |
          missing=""
          for name in HOST DEPLOY_USER DEPLOY_SSH_KEY KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing+=" ${SERVER}_$name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set, or this repository has no access:$missing"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      # deploy/restore.sh leaves a restore-failed marker while the database is missing or half
      # loaded. Starting the CMS on it would open first-admin sign-up to anyone, so don't deploy.
      - name: No unfinished restore
        run: |
          # test exits 1 when the marker is there; ssh exits 255 when it can't reach the VPS, which
          # must stop the deploy too rather than count as "no marker".
          status=0
          ssh vps "test ! -e apps/$APP/restore-failed" || status=$?
          if [ "$status" = 1 ]; then
            echo "::error title=Unfinished restore::A restore of the CMS failed or is running. Finish it with deploy/restore.sh (README, Backups), then re-run this deploy."
            exit 1
          elif [ "$status" != 0 ]; then
            echo "::error title=VPS unreachable::Couldn't check the VPS for an unfinished restore (ssh exited $status)."
            exit 1
          fi

      # --delete removes files dropped from deploy/; excluded files (.env, the restore marker) are
      # never deleted.
      - name: Sync deploy/ to ~/apps/<app>/
        run: rsync -rlz --delete --exclude=.env --exclude=.env.example --exclude=restore-failed deploy/ "vps:apps/$APP/"

      # Writes ~/apps/<app>/.env from the ENV_* settings listed below: ENV_<NAME> becomes NAME='value'.
      # The deploy owns that file and rewrites it every time, so a value changes by updating its secret
      # or variable and re-running the deploy, never by editing the file on the box.
      - name: Write .env
        env:
          # One line per setting in deploy/.env.example. secrets.* for real secrets, vars.* for the rest.
          # Listed by name rather than passing toJSON(secrets): the step only sees what the app needs, and
          # GitHub flags workflows that hand every secret to a step that talks to another host.
          ENV_PAYLOAD_SECRET: ${{ secrets.ENV_PAYLOAD_SECRET }}
          ENV_POSTGRES_PASSWORD: ${{ secrets.ENV_POSTGRES_PASSWORD }}
          ENV_R2_ACCESS_KEY_ID: ${{ secrets.ENV_R2_ACCESS_KEY_ID }}
          ENV_R2_SECRET_ACCESS_KEY: ${{ secrets.ENV_R2_SECRET_ACCESS_KEY }}
          ENV_R2_ENDPOINT: ${{ vars.ENV_R2_ENDPOINT }}
          ENV_R2_PUBLIC_BUCKET: ${{ vars.ENV_R2_PUBLIC_BUCKET }}
          ENV_R2_PUBLIC_URL: ${{ vars.ENV_R2_PUBLIC_URL }}
          ENV_R2_PRIVATE_BUCKET: ${{ vars.ENV_R2_PRIVATE_BUCKET }}
          ENV_LIBRARY_API_TOKEN: ${{ secrets.ENV_LIBRARY_API_TOKEN }}
          ENV_COMMUNITY_API_TOKEN: ${{ secrets.ENV_COMMUNITY_API_TOKEN }}
          ENV_TRAINING_API_TOKEN: ${{ secrets.ENV_TRAINING_API_TOKEN }}
        run: |
          # An empty setting usually means its secret is missing or misnamed (the workflow can't tell
          # which), so name each one on the run. The settings deploy/.env.example marks Required stop
          # the deploy; the rest are optional by design and only warn.
          for key in $(jq -rn 'env | to_entries[] | select(.key | startswith("ENV_")) | select(.value == "") | .key'); do
            case $key in
              ENV_PAYLOAD_SECRET|ENV_POSTGRES_PASSWORD)
                echo "::error title=Required setting is empty::$key is empty: set the repo secret $key"
                failed=1 ;;
              *) echo "::warning title=Setting is empty::$key is empty, so ${key#ENV_} is left out of .env" ;;
            esac
          done
          [ -z "${failed:-}" ]

          # Values are single-quoted so Compose takes them literally, $ and # included. So a value can't
          # contain a single quote or a newline; if one does, this fails before anything reaches the box.
          # Unset settings arrive empty and are left out, so the app's own defaults apply.
          filter=$(cat <<'JQ'
          env | to_entries | sort_by(.key)[]
          | select(.key | startswith("ENV_"))
          | select(.value != "")
          | if (.value | test("['\n]"))
            then error("\(.key) contains a single quote or a newline")
            else "\(.key | ltrimstr("ENV_"))='\(.value)'"
            end
          JQ
          )
          env_file="$(jq -rn "$filter")"
          printf '%s\n' "$env_file" | ssh vps "umask 077 && cat > apps/$APP/.env"

      # The ghcr.io package is public, so the VPS pulls without logging in.
      - name: docker compose up -d
        run: |
          ssh vps "APP=$APP bash -s" <<'EOF'
          set -e
          cd ~/apps/"$APP"
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          sleep 15
          docker compose ps
          # Healthy = nothing restarting and no restarts since start. One-shot containers that exited 0 pass.
          if docker inspect -f '{{.State.Restarting}} {{.RestartCount}}' $(docker compose ps -aq) | grep -qv '^false 0$'; then
            docker compose logs --tail 50
            exit 1
          fi
          EOF

      # Payload connects to its database and runs new migrations on the first request, not at start,
      # so a container that stays up proves neither. This request does, through Traefik.
      - name: App answers from its database
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$URL/api/users/init"
